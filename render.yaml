services:
  - type: web
    name: holobox-video-booth-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MOBILE_APP_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: VIDEO_PROVIDER
        value: elevenlabs
      - key: FAL_API_KEY
        sync: false
      - key: FAL_MODEL
        value: fal-ai/veo3.1/image-to-video
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_MODEL
        value: minimax/video-01
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL
        value: veo-3.1-generate-001
      - key: SELFIE_TTL_MINUTES
        value: 30
      - key: VIDEO_TTL_MINUTES
        value: 1440
      - key: SESSION_TTL_MINUTES
        value: 60
      - key: MAX_UPLOAD_MB
        value: 10
